[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-models-explained"
version = "0.1.0"
description = "Quant Models Explained: educational quant finance models with honest validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hmmlearn==0.3.3",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==2.3.3",
    "plotly==7.1.0",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.3",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "streamlit==1.66.1",
    "tzdata==2026.6",
    "yfinance==0.2.66",
]

[project.optional-dependencies]
dev = [
    "detect-secrets==1.5.0",
    "ipykernel==6.31.0",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pytest==9.0.3",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_models*", "portfolio_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
